<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>디자인코리아 관람 여정 · 종료</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#AEFF86">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0}
body{background:#fff;color:#111;font:16px/1.6 "Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
.ban{background:#AEFF86;padding:calc(env(safe-area-inset-top) + 28px) 0 30px}
.brand{font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.03em}
.brand span{display:block;font-weight:600;font-size:13px;letter-spacing:-.01em;margin-top:8px}
main{padding:48px 0}
.tag{display:inline-block;background:#111;color:#AEFF86;font-size:13px;font-weight:700;padding:4px 10px;margin-bottom:16px}
h1{font-size:clamp(32px,8vw,42px);line-height:1.15;font-weight:800;letter-spacing:-.035em}
p{color:#6e6e6e;font-size:16.5px;margin-top:14px}
</style>
</head>
<body>
<header class="ban"><div class="wrap"><div class="brand">DESIGN<br>KOREA 2026<span>팀 관람 여정 · 11.26 목 · COEX HALL B</span></div></div></header>
<main class="wrap">
  <span class="tag">종료</span>
  <h1>관람 여정이<br>끝났어요 🎟️</h1>
  <p>함께해 주셔서 고마워요. 남겨 주신 답변과 느낀 점은 정리해서 따로 공유할게요.</p>
</main>
</body>
</html>
